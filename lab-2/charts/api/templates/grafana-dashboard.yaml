apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "api.fullname" . }}-red-dashboard
  labels:
    {{- include "api.labels" . | nindent 4 }}
    grafana_dashboard: "1"
data:
  api-red.json: |
    {{- required "dashboards/api-red.json is required" (.Files.Get "dashboards/api-red.json") | nindent 4 }}