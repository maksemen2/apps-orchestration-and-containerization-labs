jaeger:
  replicas: 1
  extraVolumes:
    - name: badger-data
      persistentVolumeClaim:
        claimName: jaeger-data
  extraVolumeMounts:
    - name: badger-data
      mountPath: /badger

userconfig:
  service:
    extensions: [jaeger_storage, jaeger_query, healthcheckv2]
    pipelines:
      traces:
        receivers: [otlp]
        processors: [batch]
        exporters: [jaeger_storage_exporter]

  extensions:
    healthcheckv2:
      use_v2: true
      http:
        endpoint: 0.0.0.0:13133
    jaeger_query:
      http:
        endpoint: 0.0.0.0:16686
      storage:
        traces: lab
    jaeger_storage:
      backends:
        lab:
          badger:
            directories:
              keys: /badger/keys
              values: /badger/values
            ephemeral: false
            ttl:
              spans: 48h

  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318

  processors:
    batch: {}

  exporters:
    jaeger_storage_exporter:
      trace_storage: lab

extraObjects:
  - apiVersion: v1
    kind: PersistentVolumeClaim
    metadata:
      name: jaeger-data
      labels:
        app.kubernetes.io/instance: jaeger
    spec:
      accessModes:
        - ReadWriteOnce
      storageClassName: standard
      resources:
        requests:
          storage: 5Gi