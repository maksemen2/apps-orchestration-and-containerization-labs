kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: lab5
networking:
  disableDefaultCNI: true
  podSubnet: 10.245.0.0/16
  serviceSubnet: 10.97.0.0/16
nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          taints: []
    extraPortMappings:
      - containerPort: 30080
        hostPort: 30085
        listenAddress: 127.0.0.1
  - role: worker
