apiVersion: v1
kind: Pod
metadata:
  name: load-client
  namespace: clients
  labels:
    app: client
spec:
  restartPolicy: Never
  containers:
    - name: k6
      image: grafana/k6:1.0.0
      command: [sh, -c, 'sleep 7200']
      volumeMounts:
        - name: script
          mountPath: /script
      resources:
        requests: {cpu: 100m, memory: 64Mi}
        limits: {cpu: '1', memory: 256Mi}
  volumes:
    - name: script
      configMap:
        name: load-script
