name: lab1-monitoring

services:
  cadvisor:
    image: ghcr.io/google/cadvisor:0.60.6
    privileged: true
    cgroup: host
    ports:
      - "127.0.0.1:18090:8080"
    volumes:
      - /:/rootfs:ro
      - /sys:/sys:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/snap/docker/common/var-lib-docker:/var/snap/docker/common/var-lib-docker:ro
      - /dev/disk:/dev/disk:ro
      - /run/snap.docker/containerd/containerd.sock:/run/containerd/containerd.sock:ro
    devices:
      - /dev/kmsg:/dev/kmsg
    command:
      - --docker_only=true
      - --housekeeping_interval=5s
      - --allow_dynamic_housekeeping=false
  prometheus:
    image: prom/prometheus:v3.14.0
    ports:
      - "127.0.0.1:19090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
  grafana:
    image: grafana/grafana:13.2.2
    ports:
      - "127.0.0.1:13000:3000"
    volumes:
      - grafana-data:/var/lib/grafana

volumes:
  prometheus-data:
  grafana-data: