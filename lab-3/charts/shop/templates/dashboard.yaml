{{- if and .Values.monitoring.enabled .Values.monitoring.dashboard.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-dashboard
  labels:
    app.kubernetes.io/name: shop
    {{- include "shop.labels" . | nindent 4 }}
    grafana_dashboard: "1"
data:
  shop.json: |
    {{- .Files.Get "dashboards/shop.json" | nindent 4 }}
{{- end }}
