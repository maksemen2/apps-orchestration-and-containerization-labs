api:
  replicas: 3
  image:
    repository: registry.lab.local/shop/api
    tag: "0.2.0"
    pullPolicy: IfNotPresent
  healthFail: false
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi
worker:
  replicas: 2
  image:
    repository: registry.lab.local/shop/worker
    tag: "0.1.0"
    pullPolicy: IfNotPresent
  healthFail: false
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi
database:
  instances: 1
  image: ghcr.io/cloudnative-pg/postgresql:17.6
  # Single-instance laboratory: preserve existing SQL sessions during API outage.
  isolationCheckEnabled: false
  storage:
    size: 1Gi
    storageClass: standard
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi
monitoring:
  enabled: true
  release: monitoring
  scrapeInterval: 15s
  dashboard:
    enabled: true
