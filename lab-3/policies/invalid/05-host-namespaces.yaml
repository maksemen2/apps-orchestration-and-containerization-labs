apiVersion: v1
kind: Pod
metadata:
  name: lab3-invalid-host-namespaces
  namespace: shop
  labels:
    app.kubernetes.io/name: admission-test
    app.kubernetes.io/instance: shop
spec:
  hostNetwork: true
  restartPolicy: Never
  containers:
    - name: test
      image: ghcr.io/cloudnative-pg/postgresql:17.6
      imagePullPolicy: IfNotPresent
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          cpu: 500m
          memory: 256Mi
      securityContext:
        privileged: false
