apiVersion: v1
kind: Pod
metadata:
  name: lab3-valid
  namespace: shop
  labels:
    app.kubernetes.io/name: api
    app.kubernetes.io/instance: shop
spec:
  restartPolicy: Never
  securityContext:
    runAsNonRoot: true
    runAsUser: 10001
    runAsGroup: 10001
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: api
      image: registry.lab.local/shop/api:0.1.0
      imagePullPolicy: IfNotPresent
      env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: shop-db-app
              key: uri
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          cpu: 500m
          memory: 256Mi
      securityContext:
        privileged: false
        allowPrivilegeEscalation: false
        capabilities:
          drop: [ALL]
