apiVersion: constraints.gatekeeper.sh/v1beta1
kind: Lab3RequiredResources
metadata:
  name: lab3-require-resources
spec:
  enforcementAction: deny
  match:
    scope: Namespaced
    kinds:
      - apiGroups: [""]
        kinds: [Pod]
    excludedNamespaces:
      - kube-system
      - kube-public
      - kube-node-lease
      - local-path-storage
      - monitoring
      - gatekeeper-system
      - cnpg-system
---
apiVersion: constraints.gatekeeper.sh/v1beta1
kind: Lab3TrustedImages
metadata:
  name: lab3-trusted-images
spec:
  enforcementAction: deny
  match:
    scope: Namespaced
    kinds:
      - apiGroups: [""]
        kinds: [Pod]
    excludedNamespaces:
      - kube-system
      - kube-public
      - kube-node-lease
      - local-path-storage
      - monitoring
      - gatekeeper-system
      - cnpg-system
  parameters:
    prefixes:
      - registry.lab.local/shop/
      - ghcr.io/cloudnative-pg/
---
