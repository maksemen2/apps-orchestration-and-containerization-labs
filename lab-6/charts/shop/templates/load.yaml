apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-load-script
data:
  order.js: |
    {{- .Files.Get "files/order.js" | nindent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-load
spec:
  replicas: 1
  selector:
    matchLabels:
      app: shop-load
  template:
    metadata:
      labels:
        app: shop-load
        app.kubernetes.io/part-of: shop
      {{- if .Values.mesh.enabled }}
      annotations:
        linkerd.io/inject: enabled
        config.linkerd.io/proxy-cpu-request: "20m"
        config.linkerd.io/proxy-memory-request: "32Mi"
        config.linkerd.io/proxy-cpu-limit: "500m"
        config.linkerd.io/proxy-memory-limit: "128Mi"
      {{- end }}
    spec:
      containers:
        - name: k6
          image: grafana/k6:1.6.0
          command: [sh, -c, "sleep infinity"]
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: "1"
              memory: 256Mi
          volumeMounts:
            - name: script
              mountPath: /script
      volumes:
        - name: script
          configMap:
            name: {{ .Release.Name }}-load-script
