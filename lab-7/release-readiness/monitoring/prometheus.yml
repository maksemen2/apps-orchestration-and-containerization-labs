global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: [alertmanager:9093]

scrape_configs:
  - job_name: n8n
    metrics_path: /metrics
    static_configs:
      - targets: [n8n:5678]

  - job_name: agent
    # This Python service now exports reporting metrics only; n8n runs the AI Agent.
    scrape_interval: 5s
    metrics_path: /metrics
    static_configs:
      - targets: [agent:8000]

  - job_name: release-mcp
    scrape_interval: 5s
    metrics_path: /metrics
    static_configs:
      - targets: [release-mcp:8000]

  - job_name: ops-mcp
    scrape_interval: 5s
    metrics_path: /metrics
    static_configs:
      - targets: [ops-mcp:8000]

  - job_name: prometheus
    static_configs:
      - targets: [prometheus:9090]
